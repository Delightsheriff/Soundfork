name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-app.sh derives the build number from the commit count

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package the app (ad-hoc signed)
        run: SIGN_IDENTITY=- ./scripts/build-app.sh
